<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c12" />
    <script>
      // Resolve the palette before CSS and React load, including when storage is blocked.
      ;(() => {
        let saved
        try {
          saved = localStorage.getItem('cnp-theme')
        } catch {
          /* Device preference is enough. */
        }
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#0a0c12' : '#f7f8fc'
      })()
    </script>
    <style>
      html {
        color-scheme: light;
        --bg: #f7f8fc;
        --text: #18233b;
        background: var(--bg);
        color: var(--text);
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0a0c12;
        --text: #eef0f6;
      }
    </style>
    <title>Cristian N. Ponce — Aspiring Software Developer</title>
    <meta
      name="description"
      content="Cristian N. Ponce is a BSIT student building practical web, mobile, and desktop applications. Explore selected projects, skills, and achievements."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cristian N. Ponce — Aspiring Software Developer" />
    <meta
      property="og:description"

    />
    <meta property="og:image" content="/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cristian N. Ponce. Building ideas into practical digital experiences."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cristian N. Ponce — Aspiring Software Developer" />
    <meta name="twitter:description" content="Building ideas into practical digital experiences." />
    <meta name="twitter:image" content="/social-preview.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

</html>
